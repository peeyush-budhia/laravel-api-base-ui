services:
  web:
    image: ${FRONTEND_IMAGE:-laravel-api-base-ui:1.0.0}
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Laravel API Base}
        VITE_APP_ENV: production
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL}
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-8081}:80'
